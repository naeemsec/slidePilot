plugins { id 'com.android.application' }
android {
    namespace 'com.slidepilot.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.slidepilot.app'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
// Framework Java/XML UI only. No third-party runtime dependencies.
